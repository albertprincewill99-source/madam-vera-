<!DOCTYPE html>

  <link rel="stylesheet" href="gown.css">

  <!-- Icons -->

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Madam Vera</div>

  <div class="right-icons">
    <div class="cart-wrapper" onclick="goCart()">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cart-count">0</span>
    </div>
       <a class="women" href="mensection.html">return</a>
    <a class="back" href="index.html">Home</a>
  </div>
</div>

<!-- SEARCH -->
<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="Search..."
    onkeyup="searchProducts()"
  >
</div>

<!-- PRODUCTS -->
<div class="products">

  <div class="product">
    <img src="ass1.jpg">
    <div class="overlay">
      <h2>Silver link set</h2>
      <p>₦15,000</p>
      <button onclick="addToCart('Silver link set',15000,'ass1.jpg',this)">Add to Cart</button>
    </div>
  </div>

  <div class="product">
    <img src="ass2.jpg">
    <div class="overlay">
      <h2>futuristic shield sunglass</h2>
      <p>₦40,000</p>
      <button onclick="addToCart('futuristic shield sunglass',40000,'ass2.jpg',this)">Add to Cart</button>
    </div>
  </div>

  <div class="product">
    <img src="ass3.jpg">
    <div class="overlay">
      <h2>Octopus ear cuff</h2>
      <p>₦35,000</p>
      <button onclick="addToCart('Octopus ear cuff',35000,'ass3.jpg',this)">Add to Cart</button>
    </div>
  </div>

</div>
