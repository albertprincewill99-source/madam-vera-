<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madam Vera - Gowns</title>

  <link rel="stylesheet" href="gown.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<script defer src="app.js"></script>
</head>


<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Madam Vera</div>

  <div class="right-icons">
    <div class="cart-wrapper" onclick="goCart()">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cart-count">0</span>
    </div>
    <a class="women" href="Womensection.html">return</a>
    <a class="back" href="index.html">Home</a>
  </div>
</div>

<!-- SEARCH -->
<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="Search..."
    onkeyup="searchProducts()"
  >
</div>

<!-- PRODUCTS -->
<div class="products">

  <div class="product">
    <img src="10.jpg">
    <div class="overlay">
      <h2>Ivory tweed bustier midi</h2>
      <p>₦40,000</p>
      <button onclick="addToCart('Ivory tweed bustier midi',40000,'10.jpg',this)">Add to Cart</button>
    </div>
  </div>

  <div class="product">
    <img src="11.jpg">
    <div class="overlay">
      <h2>Floral puff sleeve midi</h2>
      <p>₦45,000</p>
      <button onclick="addToCart('Floral puff sleeve midi',45000,'11.jpg',this)">Add to Cart</button>
    </div>
  </div>

  <div class="product">
    <img src="12.jpg">
    <div class="overlay">
      <h2>Halter neck bodycon midi dress</h2>
      <p>₦40,000</p>
      <button onclick="addToCart('Halter neck bodycon midi dress',40000,'12.jpg',this)">Add to Cart</button>
    </div>
  </div>

</div>
  
<!-- SCRIPT -->  
<script>  

function addToCart(name, price, image, btn) {  
  let cart = JSON.parse(localStorage.getItem("cart")) || [];  

  cart.push({  
    name: name,  
    price: Number(price),  
    image: image  
  });  

  localStorage.setItem("cart", JSON.stringify(cart));  

  updateCartCount();  

  // Smooth feedback instead of alert  
  if (btn) {  
    let originalText = btn.innerText;  
    btn.innerText = "Added to cart";  
    btn.style.background = "#28a745";  
    btn.disabled = true;  

    setTimeout(() => {  
      btn.innerText = originalText;  
      btn.style.background = "";  
      btn.disabled = false;  
    }, 1200);  
  }  
}  


function searchProducts(){

  const input = document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const products = document.querySelectorAll(".product");

  products.forEach(product => {

    const title = product
      .querySelector("h2")
      .innerText
      .toLowerCase();

    if(title.includes(input)){

      product.style.display = "block";

    } else {

      product.style.display = "none";

    }

  });

}

function updateCartCount() {  
  let cart = JSON.parse(localStorage.getItem("cart")) || [];  
  document.getElementById("cart-count").innerText = cart.length;  
}  

function goCart() {  
  window.location.href = "cart.html";  
}  

updateCartCount();  

</script>

</div>
</body>
</html>
