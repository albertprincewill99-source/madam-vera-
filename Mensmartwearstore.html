  <link rel="stylesheet" href="gown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">

<body>
  <div class="header">
    <div class="logo">Madam Vera</div>
    <div class="right-icons">
      <div class="cart-wrapper" onclick="goCart()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
      </div>
      <a class="women" href="mensection.html">return</a>
      <a class="back" href="index.html">Home</a>
    </div>

  <!-- SEARCH -->
<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="Search..."
    onkeyup="searchProducts()"
  >
</div>



  <div class="products">
    <div class="product">
      <img src="blue.jpg">
      <div class="overlay">
        <h2>satin open collar shirt</h2>
        <p>₦35,000</p>
        <button onclick="addToCart('satin open collar shirt',35000,'blue.jpg',this)">Add to Cart</button>
      </div>
    </div>
    <div class="product">
      <img src="black.jpg">
      <div class="overlay">
        <h2>Red wrap blazer set</h2>
        <p>₦150,000</p>
        <button onclick="addToCart('Red wrap blazer set',150000,'black.jpg',this)">Add to Cart</button>
      </div>
    </div>
    <div class="product">
      <img src="thunder.jpg">
      <div class="overlay">
        <h2>Muscle tee+trouser set</h2>
        <p>₦50,000</p>
        <button onclick="addToCart('Muscle tee+trouser set',50000,'thunder.jpg',this)">Add to Cart</button>
      </div>
    </div>
  </div>
