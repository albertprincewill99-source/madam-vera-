<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madam Vera - Gowns</title>

  <link rel="stylesheet" href="gown.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
   <script defer src="app.js"></script>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo">Madam Vera</div>
    <div class="cart">🛒 0</div>
  </div>

  <!-- PRODUCTS -->
  <div class="products">

    <div class="product">
      <img src="yellow.jpg">
      <div class="overlay">
        <h2>Strapless skater dress</h2>
        <p>₦15,000</p>
        <button>Add to Cart</button>
      </div>
    </div>

    <div class="product">
      <img src="red.jpg">
      <div class="overlay">
        <h2>Regencycore</h2>
        <p>₦18,000</p>
        <button>Add to Cart</button>
      </div>
    </div>

    <div class="product">
      <img src="white.jpg">
      <div class="overlay">
        <h2>60s Riviera style</h2>
        <p>₦10,000</p>
        <button>Add to Cart</button>
      </div>
    </div>

  </div>

</body>
</html>
