<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  font-family:'Poppins',sans-serif;

  background:
  radial-gradient(circle at top, rgba(255,0,150,0.18), transparent 35%),
  radial-gradient(circle at bottom, rgba(120,60,255,0.22), transparent 40%),
  #050505;

  color:#fff;
}

/* BACKGROUND GLOW */
.bg{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.bg::before,
.bg::after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(120px);
  opacity:0.22;
}

.bg::before{
  background:#ff2ea6;
  top:-140px;
  left:-140px;
}

.bg::after{
  background:#7a3cff;
  bottom:-140px;
  right:-140px;
}

/* CARD */
.card{
  position:relative;
  width:92%;
  max-width:420px;
  max-height:92vh;
  overflow-y:auto;

  padding:28px 22px;

  border-radius:34px;

  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(24px);

  box-shadow:
  0 0 40px rgba(255,0,150,0.18),
  0 0 80px rgba(120,60,255,0.12),
  0 25px 80px rgba(0,0,0,0.6);
}

/* NEON EDGE */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:34px;
  padding:1px;

  background:linear-gradient(135deg,#ff2ea6,#7a3cff,#ff6bd6);

  -webkit-mask:
  linear-gradient(#fff 0 0) content-box,
  linear-gradient(#fff 0 0);

  -webkit-mask-composite:xor;
  mask-composite:exclude;

  pointer-events:none;
}

/* PROFILE */
.profile{
  display:flex;
  justify-content:center;
}

.avatar{
  width:150px;
  height:150px;
  border-radius:50%;
  padding:4px;

  background:linear-gradient(135deg,#ff2ea6,#7a3cff,#ff6bd6);
}

.avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:4px solid rgba(0,0,0,0.75);
}

/* NAME */
.name{
  margin-top:18px;
  text-align:center;
  font-size:1.85rem;
  font-weight:600;
}

.role{
  text-align:center;
  margin-top:6px;
  font-size:0.9rem;
  color:rgba(255,255,255,0.7);
}

/* CONTACT */
.contact{
  margin-top:20px;
  padding:14px;
  border-radius:16px;

  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}

.contact p{
  font-size:0.9rem;
  margin:6px 0;
  color:rgba(255,255,255,0.8);
}

.contact i{
  color:#ff4db8;
  margin-right:8px;
}

/* SOCIAL GRID */
.socials{
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.socials a{
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;

  border-radius:16px;

  text-decoration:none;
  color:#fff;

  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);

  transition:0.25s ease;
}

.socials a:hover{
  transform:translateY(-4px);
  background:linear-gradient(135deg,rgba(255,0,150,0.25),rgba(120,60,255,0.25));
  box-shadow:0 0 25px rgba(255,0,150,0.2);
}

/* BUTTON */
.btn{
  margin-top:22px;
  display:flex;
  justify-content:center;
}

.btn a{
  padding:13px 26px;
  border-radius:40px;

  text-decoration:none;
  color:#fff;
  font-weight:500;

  background:linear-gradient(135deg,#ff2ea6,#7a3cff);
  box-shadow:0 15px 35px rgba(255,0,150,0.25);
}

</style>
